name = "champi-partage"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
REPO = "wyssflorian/magichampi-coins-prive"        # dépôt PRIVÉ à créer (voir docs/partage-chiffre.md)
ALLOWED_ORIGIN = "https://wyssflorian.github.io"

# Anti-abus : 5 requêtes par minute et par adresse (compteur de Cloudflare, rien n'est stocké par le code)
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret à ajouter hors code :  npx wrangler secret put GITHUB_TOKEN
