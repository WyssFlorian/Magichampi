# Met à jour la météo des cartes (une data.json par région) (mesures et prévisions MétéoSuisse), deux fois par jour.
# Gratuit : les Actions sont illimitées sur un dépôt public. Lancement manuel : onglet Actions → Météo → Run workflow.
name: Météo
on:
  schedule:
    - cron: '30 5 * * *'   # ~6 h 30 heure suisse (prévisions de la nuit)
    - cron: '30 14 * * *'  # ~15 h 30 (mesures de la veille publiées)
  workflow_dispatch:
permissions:
  contents: write
concurrency: meteo
jobs:
  meteo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/meteo/requirements.txt
      - run: pip install -r .github/meteo/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache-meteo
          key: meteo-${{ github.run_id }}
          restore-keys: meteo-
      - run: python .github/meteo/meteo_update.py .cache-meteo $(ls */data.json | grep -v planning)
      - run: find .cache-meteo -type f -mtime +10 -delete
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add */data.json
          git diff --cached --quiet && exit 0
          git commit -m "Météo du $(date -u +%F)"
          git push
